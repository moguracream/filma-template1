name: Build and Deploy Filma Docs

on:
  push:
    branches: [ master ]
    paths:
      - 'admin-manual/**'
      - 'api-spec/**'
      - 'template-jwt/**'
      - 'template-no-auth/**'
      - 'index.html'
      - 'lp/**'
      - 'assets/**'
      - 'contact/**'
      - 'CNAME'
      - '*.md'
      - '_config.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'admin-manual/**'
      - 'api-spec/**'
      - 'template-jwt/**'
      - 'template-no-auth/**'
      - 'index.html'
      - 'lp/**'
      - 'assets/**'
      - 'contact/**'
      - 'scripts/test-contact-redirect.mjs'
      - 'scripts/test-homepage-pricing.mjs'
      - 'scripts/test-preview-pages.mjs'
      - 'scripts/preview-pages'
      - 'CNAME'
      - '*.md'
      - '_config.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filma-docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test static pages
        run: |
          node scripts/test-contact-redirect.mjs
          node scripts/test-homepage-pricing.mjs
          node scripts/test-preview-pages.mjs

      - name: Check docs source
        id: docs-source
        run: |
          set -euo pipefail
          if [ -f admin-manual/mkdocs.yml ] && [ -d admin-manual/docs ] && \
             [ -f api-spec/mkdocs.yml ] && [ -f api-spec/build.sh ] && [ -d api-spec/docs ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs source is not ready yet. Skipping MkDocs build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.docs-source.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material
        if: steps.docs-source.outputs.exists == 'true'
        run: |
          pip install mkdocs-material

      - name: Build Admin Manual
        if: steps.docs-source.outputs.exists == 'true'
        run: |
          mkdocs build --strict -f admin-manual/mkdocs.yml

      - name: Generate split API specification docs
        if: steps.docs-source.outputs.exists == 'true'
        run: |
          bash api-spec/build.sh generate

      - name: Build API Specification Site
        if: steps.docs-source.outputs.exists == 'true'
        run: |
          mkdocs build --strict -f api-spec/mkdocs.generated.yml

      - name: Prepare publish directory
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish

          if [ -f _config.yml ]; then
            cp -f _config.yml publish/_config.yml
          fi

          # Custom domain: kept in the repo so keep_files:false does not drop it.
          if [ -f CNAME ]; then
            cp -f CNAME publish/CNAME
          fi

          # Top page (https://docs.filma.biz/) is the developer landing page.
          # README.md is intentionally NOT published; it stays as the repo description.
          if [ -f index.html ]; then
            cp -f index.html publish/index.html
          else
            echo "index.html is required for the GitHub Pages top page." >&2
            exit 1
          fi

          # Landing page assets (absolute /lp/... paths in index.html rely on this).
          if [ -d lp ]; then
            cp -a lp publish/lp
          fi

          # Contact redirect endpoint and its JavaScript module.
          if [ -d contact ]; then
            cp -a contact publish/contact
          fi
          if [ -d assets ]; then
            cp -a assets publish/assets
          fi

          find . -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' \
            ! -name 'api_specification.md' \
            -exec cp -f {} publish/ \;

          if [ -d template-jwt ]; then
            cp -a template-jwt publish/template-jwt
          fi
          if [ -d template-no-auth ]; then
            cp -a template-no-auth publish/template-no-auth
          fi

          if [ "${{ steps.docs-source.outputs.exists }}" = "true" ]; then
            mkdir -p publish/admin-manual publish/api-spec
            cp -a admin-manual/site/. publish/admin-manual/
            cp -a api-spec/site/. publish/api-spec/
          fi

      - name: Deploy docs to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: true
