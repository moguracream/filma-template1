name: Refresh Context7 Docs

on:
  push:
    branches: [ master ]
    paths:
      - 'api-spec/**'
      - 'admin-manual/**'
      - 'template-jwt/**'
      - 'template-no-auth/**'
      - '*.md'
      - 'context7.json'
      - '.github/workflows/context7-refresh.yml'
  workflow_dispatch:

concurrency:
  group: filma-docs-context7-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 Refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CONTEXT7_API_KEY}" ]; then
            echo "CONTEXT7_API_KEY secret is not set. Skipping Context7 refresh." >&2
            exit 0
          fi

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d "{\"libraryName\": \"/${{ github.repository }}\"}")

          echo "HTTP ${status}"
          cat response.json

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "Context7 refresh failed." >&2
            exit 1
          fi
